<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }
        .product-button {
            transition: transform 0.1s ease-in-out, box-shadow 0.1s ease-in-out;
        }
        .product-button:active {
            transform: scale(0.98);
            box-shadow: 0 0 4px rgba(0,0,0,0.2) inset;
        }
        .hamburger-menu {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 25px;
            cursor: pointer;
            z-index: 50;
        }
        
        #hamburger-btn img {
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Adds a little "bounce" */
        }

        /* When the menu is open, the duck will tilt and grow slightly */
        #hamburger-btn.open img {
            transform: scale(1.2) rotate(-15deg);
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
        }
        .cart-item:hover .remove-btn {
            opacity: 1;
        }
        .remove-btn {
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }
        /* Style for items in the gold footer list */
        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 300px;
            font-family: inherit;
            font-weight: 500;
            color: #001f4c; /* Navy */
            cursor: pointer;
            transition: all 0.2s;
        }

        .cart-item-row:hover .item-text {
            text-decoration: line-through;
            opacity: 0.7;
        }

        .cart-item-row .delete-x {
            display: none;
            margin-left: 10px;
            font-weight: bold;
        }

        .cart-item-row:hover .delete-x {
            display: inline;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'navy': '#001f4c',
                        'gold': '#FFD700',
                        'sto-blue': '#bfdbfe', //Light-blue
                    },
                    borderRadius: {
                        '4xl': '2rem',
                        '5xl': '3rem',
                    }
                }
            }
        }
    </script>
</head>
<header class="bg-navy p-4 flex justify-center items-center shadow-lg relative">
    
    <div onclick="showView(document.getElementById('register-view'))" class="flex items-center space-x-3 cursor-pointer group"> 
        <div class="bg-white p-1 rounded-md shadow-sm flex items-center justify-center">
            <img src="images/Logo.png" class="h-8 w-auto object-contain" alt="STO Logo">
        </div>
        <h1 class="text-white text-2xl font-black tracking-tight group-hover:text-gold transition-colors">
            STO Store
        </h1>
    </div>

    <button id="hamburger-btn" class="absolute right-4 focus:outline-none hover:rotate-12 transition-transform active:scale-90">
        <img src="images/Duck.png" class="h-10 w-10 object-contain" alt="Menu">
    </button>
</header>

    <!-- Navigation Menu (hidden by default) -->
    <nav id="nav-menu" class="absolute top-0 right-0 w-64 h-full bg-navy text-white transform translate-x-full transition-transform ease-in-out duration-300 z-40 p-6 shadow-xl">
        <h2 class="text-3xl font-bold mb-8">Menu</h2>
        <ul>
            <li><a href="#" id="register-link" class="block py-4 text-gold hover:text-white transition-colors">Register</a></li>
            <li><a href="#" id="sales-link" class="block py-4 text-gold hover:text-white transition-colors">Sales Data</a></li>
        </ul>
    </nav>
    <div id="nav-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden"></div>

    <!-- Main Content Container -->
    <div id="app-container" class="container mx-auto p-4 flex-grow flex flex-col items-center justify-center">
        <!-- Loading and Error State -->
        <div id="loading-state" class="text-center text-navy text-xl font-bold">
            <div class="flex items-center justify-center space-x-2">
                <div class="w-4 h-4 rounded-full bg-navy animate-bounce"></div>
                <div class="w-4 h-4 rounded-full bg-navy animate-bounce" style="animation-delay: -0.1s"></div>
                <div class="w-4 h-4 rounded-full bg-navy animate-bounce" style="animation-delay: -0.2s"></div>
            </div>
            <p class="mt-4">Initializing...</p>
        </div>
        <div id="error-state" class="text-center text-red-500 text-xl font-bold hidden">There was an error. Check the console for details.</div>

        <!-- Register View -->
        <div id="register-view" class="w-full max-w-4xl flex flex-col hidden animate-fade-in p-4">
            <div class="bg-sto-blue p-8 rounded-[3rem] shadow-inner mb-6">
                <div id="product-list" class="grid grid-cols-2 sm:grid-cols-4 gap-6">
                    </div>
            </div>

            <div class="bg-gold p-6 rounded-[2.5rem] shadow-lg border-b-4 border-yellow-500 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    
                <div class="flex flex-col w-full md:w-auto">
                    <span class="text-navy font-black text-4xl italic mb-4">Total: <span id="current-total">$0.00</span></span>
        
                    <div id="cart-list" class="flex flex-col space-y-1 overflow-y-auto max-h-32 pr-4">
                        </div>
                </div>

                <button id="complete-sale-btn" class="bg-navy text-white text-2xl font-black px-12 py-4 rounded-full hover:bg-blue-900 transition-all active:scale-95 shadow-md self-center md:self-start">
                    Complete Sale
                </button>
            </div>
    
            <div id="cart-list" class="mt-4 px-6 text-navy text-sm font-bold opacity-70"></div>
        </div>

        <!-- Sales View -->
        <div id="sales-view" class="w-full max-w-5xl flex flex-col space-y-6 hidden animate-fade-in p-4">
    
    <div class="flex flex-col md:flex-row gap-4 justify-center items-center mb-2">
        <div class="bg-navy px-10 py-4 rounded-full shadow-lg text-center border-2 border-gold min-w-[200px]">
            <p class="text-gold text-xs uppercase tracking-widest font-bold">Total Transactions</p>
            <p id="total-transactions" class="text-white text-3xl font-bold">0</p>
        </div>
        <div class="bg-navy px-10 py-4 rounded-full shadow-lg text-center border-2 border-gold min-w-[200px]">
            <p class="text-gold text-xs uppercase tracking-widest font-bold">Total Revenue</p>
            <p id="total-revenue" class="text-white text-3xl font-bold">$0.00</p>
        </div>
    </div>

    <div class="bg-blue-100 p-6 md:p-8 rounded-[3rem] shadow-inner flex-grow">
        <h3 class="text-2xl font-black text-navy mb-6 flex items-center">
            <span class="mr-2">📋</span> Transaction History
        </h3>
        
        <div class="overflow-hidden rounded-2xl border border-navy border-opacity-10 bg-white shadow-sm">
            <table class="min-w-full">
                <thead class="bg-navy text-white">
                    <tr>
                        <th class="py-4 px-6 text-left text-sm font-bold uppercase tracking-wider">Time</th>
                        <th class="py-4 px-6 text-left text-sm font-bold uppercase tracking-wider">Items</th>
                        <th class="py-4 px-6 text-right text-sm font-bold uppercase tracking-wider">Total</th>
                    </tr>
                </thead>
                <tbody id="transactions-table-body" class="divide-y divide-blue-100 text-navy">
                    </tbody>
            </table>
        </div>
    </div>

    <div class="bg-gold p-2 rounded-full flex justify-between items-center shadow-lg">
        <span class="ml-8 font-black text-navy text-xl uppercase italic">Sales Report</span>
        <button id="back-to-reg-btn" onclick="showView(document.getElementById('register-view'))" 
                class="bg-navy text-white px-8 py-3 rounded-full font-bold hover:bg-blue-900 transition-all active:scale-95 shadow-md">
            Return to Register
        </button>
    </div>
</div>

    <!-- Modal for messages -->
    <div id="modal-container" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full text-center">
            <p id="modal-message" class="text-xl text-navy font-semibold mb-4"></p>
            <button id="modal-close-btn" class="bg-navy text-white px-6 py-2 rounded-lg hover:bg-blue-900 transition-colors">OK</button>
        </div>
    </div>

    <!-- Modal for Silent Auction-->>
    <div id="auction-modal" class="fixed inset-0 bg-navy bg-opacity-80 flex items-center justify-center p-4 z-[60] hidden">
        <div class="bg-sto-blue p-8 rounded-[3rem] shadow-2xl max-w-md w-full border-4 border-gold">
            <h2 class="text-3xl font-black text-navy mb-6 italic uppercase">Silent Auction Entry</h2>
        
            <div class="space-y-4">
                <div>
                    <label class="block text-navy font-bold mb-1 ml-2">Item Name/Description</label>
                    <input type="text" id="auction-item-name" placeholder="e.g., Signed Poster" 
                        class="w-full p-4 rounded-full border-2 border-navy focus:border-gold outline-none font-bold text-navy">
                </div>
                <div>
                    <label class="block text-navy font-bold mb-1 ml-2">Winning Bid Amount ($)</label>
                    <input type="number" id="auction-price" placeholder="0.00" step="0.01"
                       class="w-full p-4 rounded-full border-2 border-navy focus:border-gold outline-none font-bold text-navy">
                </div>
            </div>

            <div class="flex gap-4 mt-8">
                <button onclick="closeAuctionModal()" class="flex-1 bg-white text-navy font-black py-3 rounded-full border-2 border-navy hover:bg-gray-100 transition-all">Cancel</button>
                <button onclick="addAuctionItem()" class="flex-1 bg-navy text-white font-black py-3 rounded-full hover:bg-blue-900 transition-all">Add to Cart</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, addDoc, query, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Global Variables (provided by the environment) ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        const canvasFirebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        
        // PASTE YOUR FIREBASE CONFIG HERE to bring the app online
        const localFirebaseConfig = {
            apiKey: "AIzaSyDFeE4VRolDL0gTS-7RnD8Xtot_25jIWPE",
            authDomain: "althespiansregister.firebaseapp.com",
            projectId: "althespiansregister",
            storageBucket: "althespiansregister.appspot.com",
            messagingSenderId: "661975262277",
            appId: "1:661975262277:web:96341da8613be1a9746f2c"
        };

        let app, db, auth;
        let userId = 'unknown';
        
        // --- DOM Elements ---
        const productListEl = document.getElementById('product-list');
        const cartListEl = document.getElementById('cart-list');
        const currentTotalEl = document.getElementById('current-total');
        const completeSaleBtn = document.getElementById('complete-sale-btn');
        const totalTransactionsEl = document.getElementById('total-transactions');
        const totalRevenueEl = document.getElementById('total-revenue');
        const transactionsTableBody = document.getElementById('transactions-table-body');
        const modalContainer = document.getElementById('modal-container');
        const modalMessageEl = document.getElementById('modal-message');
        const modalCloseBtn = document.getElementById('modal-close-btn');
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const navMenu = document.getElementById('nav-menu');
        const navOverlay = document.getElementById('nav-overlay');
        const registerLink = document.getElementById('register-link');
        const salesLink = document.getElementById('sales-link');
        const registerView = document.getElementById('register-view');
        const salesView = document.getElementById('sales-view');
        const loadingState = document.getElementById('loading-state');
        const errorState = document.getElementById('error-state');

        // --- State Variables ---
        const products = [
            { name: "Accessories", price: 2.00 },
            { name: "Posters", price: 10.00 },
            { name: "Tote Bag", price: 15.00 },
            { name: "Stickers", price: 1.00 },
            { name: "Pens", price: 1.00 },
            { name: "Ducks", price: 2.00 },
            { name: "Friendship Bracelets", price: 2.00 },
            { name: "Playbills", price: 5.00 },
            { name: "Pouches", price: 10.00 },
            { name: "Tattoos", price: 1.00 },
            { name: "Stage Door Sign", price: 5.00 },
            { name: "Julius Caesar Pen Holder", price: 3.00 },
            { name: "Signed Playbill", price: 15.00 },
            { name: "Blanket", price: 15.00 },
            { name: "Makeup Faces", price: 25.00 },
            { name: "Hadestown Coloring Pages", price: 5.00 },
            { name: "Postcards", price: 2.00 }
        ];
        let currentCart = [];
        let currentTotal = 0;

        // --- Helper Functions ---
        function showMessage(message) {
            modalMessageEl.textContent = message;
            modalContainer.classList.remove('hidden');
        }

        function toggleNav() {
            navMenu.classList.toggle('translate-x-full');
            navOverlay.classList.toggle('hidden');
            hamburgerBtn.classList.toggle('open');
        }

        window.showView = function(viewElement) {
            // 1. Hide all views
            document.getElementById('register-view').classList.add('hidden');
            document.getElementById('sales-view').classList.add('hidden');

            // 2. Show the requested view
            viewElement.classList.remove('hidden');

            // 3. Close navigation if it's open (keeps the logic for the Duck menu)
            if (navMenu && !navMenu.classList.contains('translate-x-full')) {
                toggleNav();
            }
        };

        function renderProducts() {
            productListEl.innerHTML = '';
            products.forEach(product => {
                const button = document.createElement('button');
                button.className = 'bg-navy text-white p-4 h-24 rounded-[1.5rem] shadow-md hover:bg-blue-900 transition-all active:scale-95 flex flex-col items-center justify-center border-2 border-transparent hover:border-gold';
                button.innerHTML = `
                    <span class="text-sm font-bold leading-tight uppercase tracking-wide">${product.name}</span>
                    <span class="text-lg font-black mt-1">$${product.price.toFixed(2)}</span>
                `;
                button.onclick = () => addItemToCart(product);
                productListEl.appendChild(button);
            });

            // Add a special Silent Auction button at the end of the grid
            const auctionBtn = document.createElement('button');
            auctionBtn.className = 'bg-gold text-navy p-4 h-28 rounded-[1.5rem] shadow-lg hover:bg-yellow-400 transition-all active:scale-95 flex flex-col items-center justify-center border-2 border-navy';
            auctionBtn.innerHTML = `
                <span class="text-sm font-bold leading-tight uppercase tracking-wide">Silent Auction</span>
                <span class="text-xl font-black mt-2">Manual $</span>
            `;
            auctionBtn.onclick = () => openAuctionModal();
            productListEl.appendChild(auctionBtn);

        }

        function addItemToCart(product) {
            currentCart.push(product);
            currentTotal += product.price;
            updateCartDisplay();
        }

        function removeItemFromCart(index) {
            const removedItem = currentCart.splice(index, 1)[0];
            currentTotal -= removedItem.price;
            updateCartDisplay();
        }

        function updateCartDisplay() {
            const cartListEl = document.getElementById('cart-list');
            cartListEl.innerHTML = '';
    
            currentCart.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'cart-item-row group';
        
                row.innerHTML = `
                    <div class="item-text flex justify-between w-full text-xl">
                        <span>${item.name}</span>
                        <span class="ml-8">$${item.price.toFixed(2)}</span>
                    </div>
                    <span class="delete-x text-2xl text-navy">×</span>
                `;
        
                // Remove item on click
                row.onclick = () => {
                    currentCart.splice(index, 1);
                    currentTotal -= item.price;
                    updateCartDisplay();
                };
        
                cartListEl.appendChild(row);
            });

            document.getElementById('current-total').textContent = `$${currentTotal.toFixed(2)}`;
        }

        async function completeSale() {
            if (currentCart.length === 0) {
                showMessage("The cart is empty! Please add some items.");
                return;
            }

            if (!db) {
                showMessage("Offline mode: Sale not saved to database.");
                currentCart = [];
                currentTotal = 0;
                updateCartDisplay();
                return;
            }

            try {
                const newTransaction = {
                    total: currentTotal,
                    items: JSON.stringify(currentCart),
                    date: new Date().toISOString()
                };

                //  Save the transaction in a subcollection
                await addDoc(collection(
                    db,
                    "artifacts", appId,
                    "public", "data",
                    "transactions"
                ), newTransaction);

                const salesRef = doc(db, 
                "artifacts", appId, 
                "public", "data" // Use 4 segments to target the 'data' document
                );

                const salesSnap = await getDoc(salesRef);
                let salesData = salesSnap.exists()
                    ? salesSnap.data()
                    : { totalRevenue: 0, totalTransactions: 0 };

                salesData.totalRevenue += currentTotal;
                salesData.totalTransactions += 1;

                await setDoc(salesRef, salesData, { merge: true });

                currentCart = [];
                currentTotal = 0;
                updateCartDisplay();
                showMessage(`Sale Complete! Total: $${newTransaction.total.toFixed(2)}`);

            } catch (e) {
                console.error("Error completing sale:", e);
                showMessage("There was an error saving the sale data. Please check the console for details.");
            }
        }


        function setupSalesDataListener() {
            if (!db) return;

            const salesRef = doc(db, 
                "artifacts", appId, 
                "public", "data" // Use 4 segments to target the 'data' document
                );

            onSnapshot(salesRef, (docSnap) => {
                if (docSnap.exists()) {
                const data = docSnap.data();
                    totalTransactionsEl.textContent = data.totalTransactions || 0;
                    totalRevenueEl.textContent = `$${(data.totalRevenue || 0).toFixed(2)}`;
                } else {
                    totalTransactionsEl.textContent = '0';
                    totalRevenueEl.textContent = '$0.00';
                }
            }, (error) => {
                console.error("Error listening to sales data:", error);
            });

            //  Transactions subcollection stays the same
            // In setupSalesDataListener()
            const transactionsRef = collection(
                db,
                "artifacts", appId,
                "public", "data",
                "transactions"
        );

            onSnapshot(transactionsRef, (snapshot) => {
                const history = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    history.push({
                        date: data.date ? new Date(data.date).toLocaleString() : 'N/A',
                        total: data.total,
                        items: JSON.parse(data.items)
                    });
                });
                // Sort by date descending (newest first)
                history.sort((a, b) => new Date(b.date) - new Date(a.date));
                renderTransactionTable(history);
            }, (error) => {
                console.error("Error listening to transaction history:", error);
            });
        }


        function renderTransactionTable(history) {
            transactionsTableBody.innerHTML = '';
            history.forEach(transaction => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-white border-opacity-20 last:border-b-0';
                
                const dateTd = document.createElement('td');
                dateTd.className = 'py-2 px-4';
                dateTd.textContent = transaction.date;
                
                const itemsTd = document.createElement('td');
                itemsTd.className = 'py-2 px-4';
                const itemCounts = transaction.items.reduce((acc, item) => {
                    acc[item.name] = (acc[item.name] || 0) + 1;
                    return acc;
                }, {});
                itemsTd.textContent = Object.keys(itemCounts).map(item => `${item} x${itemCounts[item]}`).join(', ');

                const totalTd = document.createElement('td');
                totalTd.className = 'py-2 px-4';
                totalTd.textContent = `$${transaction.total.toFixed(2)}`;
                
                tr.appendChild(dateTd);
                tr.appendChild(itemsTd);
                tr.appendChild(totalTd);
                transactionsTableBody.appendChild(tr);
            });
        }

        //Silent Auction Functions
        window.openAuctionModal = function() {
            document.getElementById('auction-modal').classList.remove('hidden');
            document.getElementById('auction-item-name').focus();
        };

        window.closeAuctionModal = function() {
            document.getElementById('auction-modal').classList.add('hidden');
            document.getElementById('auction-item-name').value = '';
            document.getElementById('auction-price').value = '';
        };

        window.addAuctionItem = function() {
            const nameInput = document.getElementById('auction-item-name');
            const priceInput = document.getElementById('auction-price');
    
            const name = nameInput.value.trim() || "Auction Item";
            const price = parseFloat(priceInput.value);

            if (isNaN(price) || price <= 0) {
                alert("Please enter a valid price.");
                return;
            }

            // Add to currentCart manually
            const auctionProduct = { name: `Auction: ${name}`, price: price };
            currentCart.push(auctionProduct);
            currentTotal += price;
    
            updateCartDisplay();
            closeAuctionModal();
        };

        // --- Event Listeners ---
        modalCloseBtn.addEventListener('click', () => {
            modalContainer.classList.add('hidden');
        });
        hamburgerBtn.addEventListener('click', toggleNav);
        navOverlay.addEventListener('click', toggleNav);
        registerLink.addEventListener('click', (e) => {
            e.preventDefault();
            showView(registerView);
        });
        salesLink.addEventListener('click', (e) => {
            e.preventDefault();
            showView(salesView);
        });
        completeSaleBtn.addEventListener('click', completeSale);
        
        // --- Main App Initialization ---
        async function initApp() {
            loadingState.classList.remove('hidden');
            registerView.classList.add('hidden');
            salesView.classList.add('hidden');

            const firebaseConfig = localFirebaseConfig;
            
            // Set a timeout to proceed in offline mode if online initialization takes too long
            const timeoutId = setTimeout(() => {
                if (!app) {
                    console.warn("Authentication timed out. Running in offline mode.");
                    loadingState.classList.add('hidden');
                    registerView.classList.remove('hidden');
                }
            }, 5000); // 5-second timeout

            try {
                if (firebaseConfig && Object.keys(firebaseConfig).length > 0) {
                    app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);
                    setLogLevel('debug');
                
                    onAuthStateChanged(auth, async (user) => {
                        clearTimeout(timeoutId);
                        if (user) {
                            userId = user.uid;
                            renderProducts();
                            setupSalesDataListener();
                            loadingState.classList.add('hidden');
                            registerView.classList.remove('hidden');
                        } else if (initialAuthToken) {
                            try {
                                await signInWithCustomToken(auth, initialAuthToken);
                            } catch (e) {
                                console.error("Error signing in with custom token:", e);
                                await signInAnonymously(auth);
                            }
                        } else {
                            await signInAnonymously(auth);
                        }
                    });
                } else {
                    clearTimeout(timeoutId);
                    // Running in offline mode because the Firebase config is not provided.
                    console.warn("Firebase config not found. Running in offline mode. Sales data will not be persisted.");
                    userId = 'local-user';
                    renderProducts();
                    loadingState.classList.add('hidden');
                    registerView.classList.remove('hidden');
                }
            } catch (e) {
                clearTimeout(timeoutId);
                console.error("Failed to initialize the app:", e);
                loadingState.classList.add('hidden');
                errorState.classList.remove('hidden');
                showMessage("There was an error loading the app. Please check the console for details.");
            }
        }
        
        initApp();
    </script>
</body>
</html>
